<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🍒 น้องเชอร์รี่ผจญภัยแดนมอนสเตอร์</title>
<!-- 📲 PWA: installable, home-screen icon, fullscreen, offline shell -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#eef2df" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cherry Adventure" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<!-- 🎀 ฟอนต์ไทยมีหัว Sarabun (Google Fonts, OFL) — โหลดไม่ได้ (ออฟไลน์) ก็ตกไปใช้ฟอนต์ระบบ -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />   <!-- ⚡ ไม่บล็อกการวาดหน้าแรก (เดิมรอฟอนต์ = จอขาว) -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #eef2df; }
  #root { width: 100%; height: 100%; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-family: 'Sarabun', system-ui, -apple-system, sans-serif; color: #5a7a4a; z-index: 99; padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, #fbfdf2 0%, #eef2df 55%, #dfe8c8 100%);
  }
  #loading .spin { font-size: 58px; animation: bounce 0.8s infinite alternate ease-in-out; filter: drop-shadow(0 6px 6px rgba(90,122,74,0.25)); }
  #loading .ttl { font-size: 19px; font-weight: 800; color: #b0455f; letter-spacing: 0.3px; }
  #loading .bar { width: min(78vw, 340px); height: 14px; border-radius: 999px; background: rgba(90,122,74,0.15); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.12); }
  #loading .fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #f07aa8, #ffb35a, #8ad05a); background-size: 200% 100%; animation: flow 1.6s linear infinite; transition: width 0.25s ease-out; }
  #loading .pct { font-size: 26px; font-weight: 800; color: #4a6a3a; font-variant-numeric: tabular-nums; }
  #loading .st { font-size: 13.5px; font-weight: 600; min-height: 20px; }
  #loading .sub { font-size: 11.5px; opacity: 0.75; font-variant-numeric: tabular-nums; min-height: 16px; }
  #loading .tip { font-size: 12px; margin-top: 10px; max-width: 320px; color: #7a8a6a; min-height: 34px; transition: opacity 0.4s; }
  #loading button { margin-top: 6px; padding: 10px 22px; border: none; border-radius: 999px; font: 800 14px system-ui, sans-serif; color: #fff; background: linear-gradient(90deg, #e0709a, #c05a86); box-shadow: 0 4px 12px rgba(192,90,134,0.35); cursor: pointer; }
  @keyframes bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-16px) rotate(6deg); } }
  @keyframes flow { from { background-position: 0% 0; } to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="loading">
  <div class="spin">🍒</div>
  <div class="ttl">น้องเชอร์รี่ผจญภัยแดนมอนสเตอร์</div>
  <div class="pct" id="ldPct">0%</div>
  <div class="bar"><div class="fill" id="ldFill"></div></div>
  <div class="st" id="ldSt">กำลังเตรียมดาวน์โหลดเกม...</div>
  <div class="sub" id="ldSub"></div>
  <div class="tip" id="ldTip"></div>
</div>
<div id="root"></div>
<script>
/* ⏬ ตัวโหลดเกม — หน้าแรกเล็กมาก (ขึ้นทันที) แล้วดาวน์โหลดไลบรารี + โค้ดเกมพร้อมแสดงความคืบหน้าจริง (MB / %)
   ไลบรารีโหลดตามลำดับด้วย <script> (เก็บลำดับ) · โค้ดเกม (game.js) โหลดคู่กันด้วย fetch แบบนับไบต์ แล้วค่อยรันเมื่อไลบรารีครบ */
(function () {
  var CDN = "https://cdn.jsdelivr.net/npm/";
  var LIBS = [["react@18.3.1/umd/react.production.min.js", 11], ["react-dom@18.3.1/umd/react-dom.production.min.js", 132], ["three@0.128.0/build/three.min.js", 604],
    ["three@0.128.0/examples/js/loaders/GLTFLoader.js", 97], ["three@0.128.0/examples/js/utils/SkeletonUtils.js", 12], ["@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js", 111],
    ["canvas-confetti@1.9.3/dist/confetti.browser.min.js", 11]];
  var GAME_URL = "./game.js?v=aafec2b67d", GAME_KB = 7099;
  var TIPS = ["💡 แตะมอนสเตอร์เพื่อเดินเข้าไปตีอัตโนมัติ", "💡 กด 2 ครั้งติดกันเพื่อวิ่ง", "💡 ดันเจี้ยนเขาวงกตอยู่ด่าน 3 · 7 · 13", "💡 ตีบวกอาวุธได้ที่ช่างตีเหล็ก",
    "💡 เปิดออโต้แล้วตัวละครจะล่ามอนให้เอง", "💡 บอสบุกแมพดรอปอาวุธเทพ 1%", "💡 ติดตั้งเกมลงเครื่องเพื่อเปิดเร็วขึ้นครั้งถัดไป"];
  var $ = function (id) { return document.getElementById(id); };
  var libKB = 0; LIBS.forEach(function (l) { libKB += l[1]; });
  var totalKB = libKB + GAME_KB, libDone = 0, gameKB = 0, gameText = null, libsReady = false, failed = false, t0 = Date.now();
  var mb = function (kb) { return (kb / 1024).toFixed(1); };
  function paint() {
    if (failed) return;
    var got = libDone + Math.min(gameKB, GAME_KB), pct = Math.min(99, Math.floor(got / totalKB * 100));
    $("ldPct").textContent = pct + "%"; $("ldFill").style.width = pct + "%";
    var sec = (Date.now() - t0) / 1000, spd = sec > 0.5 ? got / sec : 0;
    $("ldSub").textContent = mb(got) + " / " + mb(totalKB) + " MB" + (spd > 1 ? " · " + (spd >= 1024 ? (spd / 1024).toFixed(1) + " MB/s" : Math.round(spd) + " KB/s") : "");
    $("ldSt").textContent = gameText && libsReady ? "กำลังเริ่มเกม... 🎮" : gameKB > 0 ? "กำลังดาวน์โหลดโลกของเชอร์รี่... 🌸" : "กำลังดาวน์โหลดระบบเกม... ⚙️";
  }
  var tipI = Math.floor(Math.random() * TIPS.length);
  function tip() { $("ldTip").textContent = TIPS[tipI++ % TIPS.length]; }
  tip(); var tipT = setInterval(tip, 3500);
  function fail(what) {
    if (failed) return; failed = true; clearInterval(tipT);
    $("ldSt").textContent = "⚠️ ดาวน์โหลดไม่สำเร็จ (" + what + ") — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่";
    $("ldSub").textContent = "";
    var b = document.createElement("button"); b.textContent = "🔄 ลองใหม่"; b.onclick = function () { location.reload(); }; $("loading").appendChild(b);
  }
  function start() {
    if (!gameText || !libsReady || failed) return;
    paint(); $("ldPct").textContent = "100%"; $("ldFill").style.width = "100%";
    setTimeout(function () {
      clearInterval(tipT);
      var s = document.createElement("script");
      try { s.src = URL.createObjectURL(new Blob([gameText], { type: "application/javascript" })); } catch (e) { s.text = gameText; }
      s.onerror = function () { fail("เริ่มเกม"); };
      document.body.appendChild(s); gameText = null;
    }, 60);
  }
  // 1) ไลบรารี — ทีละไฟล์ตามลำดับ
  (function next(i) {
    if (i >= LIBS.length) { libsReady = true; paint(); start(); return; }
    var s = document.createElement("script"); s.src = CDN + LIBS[i][0];
    s.onload = function () { libDone += LIBS[i][1]; paint(); next(i + 1); };
    s.onerror = function () { fail("ไลบรารี " + LIBS[i][0].split("/")[0]); };
    document.head.appendChild(s);
  })(0);
  // 2) โค้ดเกม — นับไบต์ระหว่างดาวน์โหลด
  function viaXHR() {
    var x = new XMLHttpRequest(); x.open("GET", GAME_URL); x.responseType = "text";
    x.onprogress = function (e) { gameKB = e.loaded / 1024; paint(); };
    x.onload = function () { if (x.status >= 200 && x.status < 300 || x.status === 0) { gameKB = GAME_KB; gameText = x.responseText; paint(); start(); } else fail("โค้ดเกม " + x.status); };
    x.onerror = function () { fail("โค้ดเกม"); };
    x.send();
  }
  if (window.fetch && window.ReadableStream && window.TextDecoder) {
    fetch(GAME_URL).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      if (!r.body || !r.body.getReader) return r.text().then(function (t) { gameKB = GAME_KB; gameText = t; paint(); start(); });
      var rd = r.body.getReader(), dec = new TextDecoder(), parts = [], n = 0;
      return (function pump() { return rd.read().then(function (c) {
        if (c.done) { parts.push(dec.decode()); gameText = parts.join(""); gameKB = GAME_KB; paint(); start(); return; }
        n += c.value.length; gameKB = n / 1024; parts.push(dec.decode(c.value, { stream: true })); paint(); return pump(); }); })();
    }).catch(function () { viaXHR(); });
  } else viaXHR();
  paint();
})();
</script>

<!-- 📲 PWA: service worker + install prompt -->
<script>
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
  var deferred = null;
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches || window.navigator.standalone === true;
  }
  function makeBtn() {
    if (document.getElementById("pwaInstall") || isStandalone()) return null;
    var wrap = document.createElement("div");
    wrap.id = "pwaInstall";
    wrap.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:2147483647;max-width:calc(100vw - 20px);box-sizing:border-box;padding:11px 12px 12px;border-radius:16px;background:rgba(26,18,32,0.94);box-shadow:0 8px 28px rgba(0,0,0,0.42);border:1px solid rgba(255,255,255,0.14);font-family:system-ui,sans-serif;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);";
    var row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:8px;justify-content:center;";
    var b = document.createElement("button");
    b.innerHTML = "📲 ติดตั้งเกมลงเครื่อง";
    b.style.cssText = "padding:9px 16px;border:none;border-radius:999px;cursor:pointer;font:800 13.5px system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,#e0709a,#c05a86);box-shadow:0 4px 14px rgba(150,90,120,0.4);";
    b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; wrap.remove(); }); };
    var x = document.createElement("button");
    x.textContent = "✕";
    x.style.cssText = "border:none;background:rgba(255,255,255,0.12);color:#e6dce8;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:800;flex:0 0 auto;";
    x.onclick = function (e) { e.stopPropagation(); wrap.remove(); };
    row.appendChild(b); row.appendChild(x);
    var note = document.createElement("div");
    note.innerHTML = "🍒 <b>เกมปลอดภัย</b> — ถ้าขึ้นเตือน \"Play Protect\" กด <b>ยืนยัน</b> ได้เลย<br>ติดตั้งไม่ได้ (Android รุ่นใหม่)? กด <b>⋮</b> ของเบราว์เซอร์ → <b>“เพิ่มไปยังหน้าจอโฮม”</b> หรือเล่นในเบราว์เซอร์ได้เต็มที่";
    note.style.cssText = "margin-top:9px;font-size:10.5px;line-height:1.55;color:#cdbdd6;max-width:290px;";
    wrap.appendChild(row); wrap.appendChild(note);
    document.body.appendChild(wrap);
    return wrap;
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    makeBtn();
  });
  window.addEventListener("appinstalled", function () {
    deferred = null;
    var b = document.getElementById("pwaInstall");
    if (b) b.remove();
  });
})();
</script>
</body>
</html>
