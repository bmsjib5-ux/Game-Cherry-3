    row.style.cssText = "display:flex;align-items:center;gap:8px;justify-content:center;";
    var b = document.createElement("button");
    b.innerHTML = "📲 ติดตั้งเกมลงเครื่อง";
    b.style.cssText = "padding:9px 16px;border:none;border-radius:999px;cursor:pointer;font:800 13.5px system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,#e0709a,#c05a86);box-shadow:0 4px 14px rgba(150,90,120,0.4);";
    b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; wrap.remove(); }); };
    var x = document.createElement("button");
    x.textContent = "✕";
    x.style.cssText = "border:none;background:rgba(255,255,255,0.12);color:#e6dce8;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:800;flex:0 0 auto;";
    x.onclick = function (e) { e.stopPropagation(); wrap.remove(); };
    row.appendChild(b); row.appendChild(x);
    var note = document.createElement("div");
    note.innerHTML = "🍒 <b>เกมปลอดภัย</b> — ถ้าขึ้นเตือน \"Play Protect\" กด <b>ยืนยัน</b> ได้เลย<br>ติดตั้งไม่ได้ (Android รุ่นใหม่)? กด <b>⋮</b> ของเบราว์เซอร์ → <b>“เพิ่มไปยังหน้าจอโฮม”</b> หรือเล่นในเบราว์เซอร์ได้เต็มที่";
    note.style.cssText = "margin-top:9px;font-size:10.5px;line-height:1.55;color:#cdbdd6;max-width:290px;";
    wrap.appendChild(row); wrap.appendChild(note);
    document.body.appendChild(wrap);
    return wrap;
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    makeBtn();
  });
  window.addEventListener("appinstalled", function () {
    deferred = null;
    var b = document.getElementById("pwaInstall");
    if (b) b.remove();
  });
})();
</script>
