# Render Blueprint — static site สำหรับเกม "น้องเชอร์รี่ผจญภัยแดนมอนสเตอร์"
# วิธีใช้: ไปที่ Render dashboard > New > Blueprint แล้วเชื่อม repo นี้
# Render จะอ่านไฟล์นี้และสร้าง static site ให้อัตโนมัติ
services:
  - type: web
    name: game-cherry-3
    runtime: static
    # ไม่มีขั้นตอน build เพราะเกมเป็น HTML ที่ precompiled แล้ว
    buildCommand: ""
    # เสิร์ฟไฟล์จาก root ของ repo (index.html อยู่ที่นี่)
    staticPublishPath: .
    # ทุก path ให้ตกลงมาที่ index.html (รองรับการรีเฟรช/ลิงก์ตรง)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # 💾 แคช: โค้ดเกม/หน้าเว็บ = no-cache (ถามเซิร์ฟเวอร์ทุกครั้ง แต่ไฟล์ไม่เปลี่ยนได้ 304 ไม่ต้องโหลดใหม่)
    #    เดิมตั้ง no-store ทุกไฟล์ → ผู้เล่นโหลด game.js ~7.7MB + โมเดล/เสียงใหม่หมดทุกครั้งที่เปิด = เปลือง bandwidth มาก
    #    ไฟล์ใน assets/ (โมเดล · เท็กซ์เจอร์ · เสียง) เปลี่ยนน้อย → ให้เบราว์เซอร์เก็บไว้ 7 วัน
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
